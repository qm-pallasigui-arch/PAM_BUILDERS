<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <!-- ═══════════════════════════════════════════════════════════════════
         SEO META TAGS
         REPLACE everything marked with REPLACE below.
         These tags help Google rank your site and control how your link
         looks when shared on Facebook, Viber, iMessage, etc.
    ════════════════════════════════════════════════════════════════════ -->

    <!-- REPLACE: The tab title shown in the browser and on Google search results -->
    <title>PAM Builders | Construction Corp.</title>

    <!-- REPLACE: 150-160 character description shown under your site name on Google -->
    <meta name="description" content="PAM Builders — trusted residential and commercial construction company. Custom homes, renovations, and commercial builds. Get a free quote today." />

    <!-- REPLACE: Comma-separated keywords relevant to your business and location -->
    <meta name="keywords" content="contractor, construction, residential, commercial, renovation, remodeling" />

    <!-- Tells Google to index this page and follow its links -->
    <meta name="robots" content="index, follow" />

    <!-- REPLACE: Your business name -->
    <meta name="author" content="PAM Builders" />

    <!-- ── Open Graph — controls how your link looks on Facebook, Viber, etc. ── -->
    <!-- REPLACE: Same as your <title> above -->
    <meta property="og:title" content="PAM Builders | Residential & Commercial Construction" />
    <!-- REPLACE: Same as your <meta name="description"> above -->
    <meta property="og:description" content="Trusted residential and commercial construction company. Custom homes, renovations, and commercial builds. Get a free quote today." />
    <!-- REPLACE: Your live website URL once deployed (e.g. https://yourproject.vercel.app) -->
    <meta property="og:url" content="https://yourproject.vercel.app" />
    <meta property="og:type" content="website" />
    <!-- REPLACE: URL of an image to show when your link is shared (1200x630px recommended) -->
    <!-- You can upload a photo to src/assets/ and reference it here, or use an absolute URL -->
    <meta property="og:image" content="https://yourproject.vercel.app/og-image.jpg" />

    <!-- ── Twitter/X Card ── -->
    <meta name="twitter:card" content="summary_large_image" />
    <!-- REPLACE: Same as og:title -->
    <meta name="twitter:title" content="PAM Builders | Residential & Commercial Construction" />
    <!-- REPLACE: Same as og:description -->
    <meta name="twitter:description" content="Trusted residential and commercial construction company. Get a free quote today." />

    <!-- ── Favicon ── -->
    <!-- REPLACE: Add your own favicon. Place it in the /public folder and update this path. -->
    <!-- To generate a favicon from a logo, use: https://favicon.io -->
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <!-- Fallback for older browsers -->
    <link rel="icon" type="image/png" href="/favicon.png" />

    <!-- ═══════════════════════════════════════════════════════════════════
         END OF SEO META TAGS
    ════════════════════════════════════════════════════════════════════ -->
  </head>

  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
